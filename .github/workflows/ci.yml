name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun test
      - run: node --test test/agent-phone.test.mjs
      - run: bash -n bin/install.sh
