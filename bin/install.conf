# bin/install.sh settings for group.call (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: settings go in $STATE_DIR/app.env, written from the logicsrc
# vault profullstack/group-call--prod (GROUPCALL_KEY, GROUPCALL_COINPAY_CLIENT_ID/SECRET,
# COINPAY_API_KEY, COINPAY_WEBHOOK_SECRET, TELNYX_API_KEY, TELNYX_PUBLIC_KEY,
# GROUPCALL_DIAL_IN, GROUPCALL_AGENT_WORKER_KEY, GROUPCALL_AGENT_OPERATORS,
# GROUPCALL_AGENT_CALLER_IDS=riotcoder=+1...,cha0spunk=+1..., GROUPCALL_TRANSCRIBE, ...).
#
# group.call.pit.world is a pit.world hostname (.call is a real ICANN ending, so
# there is no Moshpit name). *.pit.world already points at dev2; its exact-name
# nginx vhost and Let's Encrypt cert come from pit-proxy-cert, see README.
APP=group-call
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8810
HEALTH_PATH=/health
DOMAINS=
ACCESS_LOG=off
